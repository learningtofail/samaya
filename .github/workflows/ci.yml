name: CI

# Runs the pytest suite and JS lint on every push and pull request against
# master — spec §30. Before this, `pytest` only ran when a patch happened
# to get tested locally before being handed off; nothing caught a
# regression automatically between that and the manual production deploy.
# No Postgres service needed: tests/conftest.py uses an in-memory SQLite
# database (see its own module docstring), so this workflow is just
# "install deps, run pytest" — the same commands used locally.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --no-cache-dir -r requirements-dev.txt
      - run: pytest -q

  frontend:
    # eslint plus (audit remediation, Phase 4) the vitest suite covering
    # events-public.js's pure functions (tests/frontend/) — npm ci already
    # pulls both eslint and vitest from devDependencies, so this is one job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm test

  alembic-baseline:
    # Verifies app/alembic/versions/ actually applies cleanly against a real
    # Postgres and stays in sync with models/db.py — the in-memory-SQLite
    # pytest job above never touches Alembic at all, so this is the only
    # thing that would catch "someone changed a model but forgot to add a
    # migration" before it reaches production.
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kingshot_scheduler
          POSTGRES_USER: taraka
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taraka -d kingshot_scheduler"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: postgresql+asyncpg://taraka:ci_only_password@localhost:5432/kingshot_scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --no-cache-dir -r requirements.txt
      - run: alembic upgrade head
      - run: alembic check   # fails if models/db.py drifted from the migrations

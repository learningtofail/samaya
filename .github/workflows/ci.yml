name: CI

# Runs the pytest suite and JS lint on every push and pull request against
# master — spec §30. Before this, `pytest` only ran when a patch happened
# to get tested locally before being handed off; nothing caught a
# regression automatically between that and the manual production deploy.
# No Postgres service needed: tests/conftest.py uses an in-memory SQLite
# database (see its own module docstring), so this workflow is just
# "install deps, run pytest" — the same commands used locally.

on:
  push:
    branches: [master, unified-event-model]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --no-cache-dir -r requirements-dev.txt
      - run: ruff check .   # audit remediation, Phase 5 — config/ignores in the repo-root pyproject.toml
      - run: pytest -q

  frontend:
    # eslint plus (audit remediation, Phase 4) the vitest suite covering
    # events-public.js's pure functions (tests/frontend/) — npm ci already
    # pulls both eslint and vitest from devDependencies, so this is one job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # vitest 5 and jsdom 30 require Node ^22.12 (^22.22.2 for jsdom).
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm test

  docker-build:
    # Audit remediation, Phase 5 — proves app/Dockerfile still builds and
    # actually boots on every push/PR. Before this, a change that broke the
    # image (a typo in requirements.txt, a COPY path that stopped matching,
    # the app failing main.py's own startup check inside the container) was
    # only caught manually at deploy time on lxc-taraka, after the fact.
    # Needs a real Postgres — main.py's lifespan no longer creates tables
    # itself (Phase 1: that's Alembic's job now), and the production image
    # only ever installs requirements.txt, which has no sqlite driver — so
    # this runs `alembic upgrade head` against a real postgres:16-alpine
    # service first, then boots the actual built image against it with
    # --network host (the only way a plain `docker run` container can reach
    # a GitHub Actions service container's mapped port). This does not push
    # the image anywhere or replace the actual deploy step.
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kingshot_scheduler
          POSTGRES_USER: taraka
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taraka -d kingshot_scheduler"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://taraka:ci_only_password@localhost:5432/kingshot_scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --no-cache-dir -r app/requirements.txt
      - run: cd app && alembic upgrade head
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: false
          load: true
          tags: samaya-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the built image
        run: |
          docker run -d --name samaya-ci --network host \
            -e SECRET_KEY=ci-only-secret \
            -e DISCORD_OAUTH_CLIENT_ID=ci-client-id \
            -e DISCORD_OAUTH_CLIENT_SECRET=ci-client-secret \
            -e DISCORD_OAUTH_REDIRECT_URI=http://localhost:8000/auth/callback \
            -e DATABASE_URL="$DATABASE_URL" \
            samaya-ci:latest
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/api/kingdom-branding >/dev/null 2>&1; then
              echo "Container is up and responding."; exit 0
            fi
            sleep 2
          done
          echo "Container never became healthy:"; docker logs samaya-ci; exit 1

  alembic-baseline:
    # Verifies app/alembic/versions/ actually applies cleanly against a real
    # Postgres and stays in sync with models/db.py — the in-memory-SQLite
    # pytest job above never touches Alembic at all, so this is the only
    # thing that would catch "someone changed a model but forgot to add a
    # migration" before it reaches production.
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kingshot_scheduler
          POSTGRES_USER: taraka
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taraka -d kingshot_scheduler"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: postgresql+asyncpg://taraka:ci_only_password@localhost:5432/kingshot_scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --no-cache-dir -r requirements.txt
      - run: alembic upgrade head
      - run: alembic check   # fails if models/db.py drifted from the migrations
      # Revision a1f0c0de0004 seeds data; this runs it against old-shaped rows (spec §67.8).
      - run: pip install --no-cache-dir -r requirements-dev.txt
      - run: pytest tests/test_migration_0004.py tests/test_migration_0005.py -q
        env:
          SAMAYA_MIGRATION_TEST_PG: postgresql://taraka:ci_only_password@localhost:5432

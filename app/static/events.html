<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kingshot Event Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/events.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to schedule</a>

<header class="hdr">
  <div class="brand">
    <div class="brand-text">
      <div class="kicker" id="pageKicker">Kingshot</div>
      <h1 id="pageTitle">Event Schedule</h1>
    </div>
  </div>
  <div class="hdr-actions">
    <button type="button" id="clockBtn" class="chip-btn" title="Current UTC time and your local time. Click to change your time zone.">Loading…</button>
    <div class="menu-wrap">
      <button type="button" id="calMenuBtn" class="btn-gold" aria-haspopup="true" aria-expanded="false" aria-controls="calMenu">Add to calendar ▾</button>
      <div id="calMenu" class="menu" role="menu" hidden></div>
    </div>
  </div>
</header>

<main id="main" class="page" tabindex="-1">
  <section id="hero" class="hero-row" aria-label="Live now and next up"></section>
  <p id="lastActivity" class="activity" hidden></p>

  <section class="controls" aria-label="Schedule controls">
    <div id="allianceChips" class="chips" role="group" aria-label="Filter by alliance"></div>
    <div class="ctl-right">
      <button type="button" id="keyBtn" class="btn-plain" aria-expanded="false" aria-controls="legendPanel">Key ▾</button>
      <div class="seg" role="group" aria-label="View">
        <button type="button" id="viewListBtn" aria-pressed="true">List</button>
        <button type="button" id="viewCalendarBtn" aria-pressed="false">Calendar</button>
      </div>
    </div>
  </section>

  <div id="legendPanel" class="legend" hidden></div>

  <section id="calendarWrap" class="cal" hidden aria-label="Calendar">
    <div class="cal-head">
      <div class="cal-nav">
        <button type="button" id="calPrevBtn" class="btn-plain"></button>
        <button type="button" id="calTodayBtn" class="btn-plain">Today</button>
        <button type="button" id="calNextBtn" class="btn-plain"></button>
      </div>
      <h2 id="calMonthLabel" class="cal-title"></h2>
    </div>
    <div id="calGrid" class="cal-grid"></div>
  </section>

  <div id="schedule" aria-live="polite">
    <p class="empty">Loading events…</p>
  </div>
</main>

<footer class="ftr">
  <span id="footerText">Times shown in your time zone and UTC · Powered by Samaya</span>
  <span class="ftr-links"><a href="/feedback">Feedback</a><a id="icsLink" href="/ics/events.ics">ICS feed</a></span>
</footer>

<!-- Time zone -->
<div class="modal" id="timezoneModal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="timezoneModalTitle">
    <header class="modal-head"><h2 id="timezoneModalTitle">Time zone</h2><button type="button" class="modal-x" data-close aria-label="Close">×</button></header>
    <div class="modal-body">
      <p id="timezoneModalIntro" class="muted"></p>
      <label class="field"><span class="sr-only">Time zone</span><select id="timezoneSelect"></select></label>
    </div>
    <footer class="modal-foot"><button type="button" class="btn-gold" data-close>Done</button></footer>
  </div>
</div>

<!-- Discord preview -->
<div class="modal" id="discordPreviewModal" hidden>
  <div class="modal-box modal-md" role="dialog" aria-modal="true" aria-labelledby="discordPreviewModalTitle">
    <header class="modal-head"><h2 id="discordPreviewModalTitle">Discord preview</h2><button type="button" class="modal-x" data-close aria-label="Close">×</button></header>
    <div class="modal-body"><div id="discordPreviewModalBody"></div></div>
    <footer class="modal-foot"><button type="button" class="btn-gold" data-close>Close</button></footer>
  </div>
</div>

<!-- Report an issue -->
<div class="modal" id="reportIssueModal" hidden>
  <div class="modal-box modal-md" role="dialog" aria-modal="true" aria-labelledby="reportIssueModalTitle">
    <header class="modal-head"><h2 id="reportIssueModalTitle">Report an issue</h2><button type="button" class="modal-x" data-close aria-label="Close">×</button></header>
    <div class="modal-body">
      <p id="reportIssueModalSubject" class="muted"></p>
      <label class="field"><span>What is wrong?</span>
        <select id="riErrorType">
          <option>Wrong date or time</option>
          <option>Wrong channel</option>
          <option>Duplicate posting</option>
          <option>Didn't happen as scheduled</option>
          <option>Other</option>
        </select>
      </label>
      <label class="field"><span>Description</span><textarea id="riDescription" rows="4" maxlength="2000" placeholder="What did you notice?"></textarea></label>
      <label class="field"><span>Contact (optional)</span><input id="riContact" placeholder="Discord handle or email. Used for follow-up only and never shown publicly."></label>
      <p id="riNote" class="muted" role="status"></p>
    </div>
    <footer class="modal-foot"><button type="button" id="riSubmit" class="btn-gold">Submit</button><button type="button" class="btn-plain" data-close>Cancel</button></footer>
  </div>
</div>

<script src="/static/events-public.js"></script>
</body>
</html>

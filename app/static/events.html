<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kingshot Event Schedule</title>
<link rel="stylesheet" href="/static/vendor/patternfly/patternfly.min.css">
<link rel="stylesheet" href="/static/vendor/patternfly/patternfly-addons.css">
<style>
  /* Small, deliberate additions on top of PatternFly — everything else on
     this page is real PatternFly markup/classes, not a custom theme.
     Emoji are used for icons rather than an icon font, to avoid adding a
     second vendored/CDN dependency for a handful of glyphs. */
  .samaya-event-row {
    display: flex;
    align-items: flex-start;
    gap: var(--pf-t--global--spacer--md);
  }
  .samaya-date-col {
    text-align: right;
    min-width: 4.5rem;
    flex-shrink: 0;
  }
  .samaya-date-day { font-size: var(--pf-t--global--font--size--heading--lg); font-weight: var(--pf-t--global--font--weight--heading--bold); line-height: 1; }
  .samaya-date-dow { font-size: var(--pf-t--global--font--size--body--sm); color: var(--pf-t--global--text--color--subtle); text-transform: uppercase; letter-spacing: .06em; }
  .samaya-date-col.samaya-today .samaya-date-day { color: var(--pf-t--global--color--brand--default); }
  .samaya-event-meta { display: flex; flex-wrap: wrap; gap: var(--pf-t--global--spacer--md); align-items: center; }
  .samaya-week-header { margin-block: var(--pf-t--global--spacer--lg) var(--pf-t--global--spacer--sm); text-transform: uppercase; letter-spacing: .08em; }
  .samaya-week-header:first-of-type { margin-block-start: 0; }
  /* The masthead's own internal layout mechanism (CSS grid, per its
     grid-area:header) didn't shrink the title against the fixed-width
     button next to it the way a plain flex-child override assumed —
     forcing an explicit, guaranteed flex layout here instead of
     continuing to guess at PatternFly's internal grid template. */
  .pf-v6-c-masthead { display: flex !important; align-items: center !important; flex-wrap: nowrap !important; gap: var(--pf-t--global--spacer--md); background-color: #151515 !important; }
  .pf-v6-c-masthead__main { flex: 1 1 auto !important; min-width: 0 !important; overflow: hidden !important; }
  .pf-v6-c-masthead__content { flex: 0 0 auto !important; }
  #pageTitle { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 700px) {
    /* Title and button genuinely can't share one row at this width —
       wrap instead of letting nowrap force an overflow. */
    .pf-v6-c-masthead { flex-wrap: wrap !important; row-gap: var(--pf-t--global--spacer--sm); }
    .pf-v6-c-masthead__content { flex: 1 1 100% !important; }
  }
  @media (max-width: 600px) {
    .samaya-date-col { min-width: 3rem; }
    .samaya-date-day { font-size: var(--pf-t--global--font--size--heading--md); }
  }
</style>
</head>
<body>

<div class="pf-v6-c-page">

  <header class="pf-v6-c-masthead">
    <div class="pf-v6-c-masthead__main">
      <span class="pf-v6-c-masthead__brand">
        <h1 id="pageTitle" style="color:var(--pf-t--global--text--color--inverse);margin:0;font-size:var(--pf-t--global--font--size--heading--lg);font-weight:var(--pf-t--global--font--weight--heading--bold)">⏱ Kingshot Event Schedule</h1>
      </span>
    </div>
    <div class="pf-v6-c-masthead__content">
      <a class="pf-v6-c-button pf-m-primary" id="icsLink" href="#">📅 Subscribe to Calendar</a>
    </div>
  </header>

  <div class="pf-v6-c-page__main-container">
  <main class="pf-v6-c-page__main" tabindex="-1" id="main-content">
    <section class="pf-v6-c-page__main-section">
      <div class="pf-v6-c-card pf-v6-u-mb-lg">
        <div class="pf-v6-c-card__body">
          <div class="pf-v6-l-flex pf-m-justify-content-space-between pf-m-align-items-center">
            <div class="pf-v6-l-flex__item">
              <div class="pf-v6-c-content">
                <p>
                  <strong>Subscribe to stay up to date.</strong>
                  Add our calendar to Google Calendar, Apple Calendar, or any app that supports ICS.
                  It updates automatically — no manual refresh needed.
                </p>
              </div>
            </div>
            <div class="pf-v6-l-flex__item">
              <a class="pf-v6-c-button pf-m-secondary" id="icsLinkBottom" href="#">📅 Get ICS Feed</a>
            </div>
          </div>
        </div>
      </div>

      <div id="content">
        <div class="pf-v6-c-empty-state">
          <div class="pf-v6-c-empty-state__content">
            <div class="pf-v6-c-empty-state__body">Loading events…</div>
          </div>
        </div>
      </div>
    </section>
  </main>
  </div>
</div>

<footer class="pf-v6-c-page__main-section pf-m-light" style="text-align:center;padding-block:var(--pf-t--global--spacer--xl)">
  <div class="pf-v6-c-content">
    <p id="footerText" style="color:var(--pf-t--global--text--color--subtle)">All times are UTC · Powered by Samaya</p>
  </div>
</footer>

<script>
// This page is served two ways: /t/{tenant_slug}/events (one alliance)
// or bare /events (every alliance combined) — mode is read straight from
// the page's own URL rather than templated server-side, since it's the
// same static file either way.
const PATH_PARTS   = window.location.pathname.split('/').filter(Boolean); // ['t','mod','events'] or ['events']
const COMBINED_MODE = PATH_PARTS[0] !== 't';
const TENANT_SLUG   = COMBINED_MODE ? '' : (PATH_PARTS[1] || '');

const API_URL = COMBINED_MODE ? '/api/events' : `/t/${TENANT_SLUG}/api/events`;
const ICS_URL = COMBINED_MODE ? '/ics/events.ics' : `/t/${TENANT_SLUG}/ics/events.ics`;

document.getElementById('pageTitle').textContent = COMBINED_MODE
  ? '⏱ Kingshot Event Schedule — All Alliances'
  : `⏱ ${TENANT_SLUG.toUpperCase()} — Kingshot Event Schedule`;
document.getElementById('icsLink').href = ICS_URL;
document.getElementById('icsLinkBottom').href = ICS_URL;
document.getElementById('footerText').innerHTML =
  `All times are UTC · <a href="${ICS_URL}">ICS Calendar Feed</a> · Powered by Samaya`;

const DOW_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTH    = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// This page is public and unauthenticated — every field below comes from
// the database (admin-editable event names/descriptions/channels), so it
// must be escaped before going into innerHTML.
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function formatTime(iso) {
  return iso.slice(11, 16) + ' UTC';
}

function formatDuration(hours) {
  if (hours === 24) return '24h (all day)';
  if (hours < 1)   return `${Math.round(hours * 60)}min`;
  return `${hours}h`;
}

// PatternFly Label component (pf-v6-c-label) with its own fixed color
// modifiers (pf-m-green/pf-m-blue/etc.) — these three badge kinds all map
// to a fixed, small set of meanings, so they use real PatternFly labels
// rather than one-off custom styling.
function statusBadge(status) {
  const label = (cls, text) =>
    `<span class="pf-v6-c-label ${cls} pf-m-filled"><span class="pf-v6-c-label__content"><span class="pf-v6-c-label__text">${text}</span></span></span>`;
  switch (status) {
    case 'posted':    return label('pf-m-green',  'Announced');
    case 'active':    return label('pf-m-blue',   'Live Now');
    case 'completed': return label('pf-m-grey',   'Completed');
    case 'cancelled': return label('pf-m-red',    'Cancelled');
    case 'pending':
    default:          return label('pf-m-grey',   'Upcoming');
  }
}

function scopeBadge(scope) {
  if (scope !== 'kingdom-wide') return '';
  return `<span class="pf-v6-c-label pf-m-purple pf-m-filled" title="Every alliance in this Kingdom plays this together"><span class="pf-v6-c-label__content"><span class="pf-v6-c-label__text">🌐 Kingdom-wide</span></span></span>`;
}

function tenantBadge(ev) {
  // Only shown in combined mode — on a single alliance's own page every
  // event is obviously that alliance's, so the badge would be noise.
  // Each alliance's own color is arbitrary (admin-configured per tenant),
  // not one of PatternFly's fixed label colors — pf-m-custom is
  // PatternFly's own designed-for-this mechanism: it remaps the label's
  // base --pf-v6-c-label--BackgroundColor/Color variables from
  // --pf-v6-c-label--m-custom--BackgroundColor/Color, which is exactly
  // what an inline style below can override with an arbitrary hex.
  if (!COMBINED_MODE || !ev.tenant_name) return '';
  const color = escapeHtml(ev.tenant_color || '#6a6e73');
  return `<span class="pf-v6-c-label pf-m-filled pf-m-custom" style="--pf-v6-c-label--m-custom--BackgroundColor:${color};--pf-v6-c-label--m-custom--Color:#fff"><span class="pf-v6-c-label__content"><span class="pf-v6-c-label__text">${escapeHtml(ev.tenant_name)}</span></span></span>`;
}

function weekLabel(dateStr) {
  const d = new Date(dateStr + 'T12:00:00Z');
  const today = new Date();
  today.setUTCHours(12, 0, 0, 0);
  const diff = Math.floor((d - today) / 86400000);

  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';

  const startOfWeek = new Date(today);
  const dayOfWeek   = (today.getUTCDay() + 6) % 7; // 0=Mon
  startOfWeek.setUTCDate(today.getUTCDate() - dayOfWeek);

  const weekNum = Math.floor((d - startOfWeek) / (7 * 86400000));
  if (weekNum === 0) return 'This Week';
  if (weekNum === 1) return 'Next Week';

  const monthName = MONTH[d.getUTCMonth()];
  return `${monthName} ${d.getUTCDate()} week`;
}

function emptyState(title, body) {
  return `
    <div class="pf-v6-c-empty-state">
      <div class="pf-v6-c-empty-state__content">
        <div class="pf-v6-c-empty-state__header">
          <h2 class="pf-v6-c-title pf-m-lg">${title}</h2>
        </div>
        <div class="pf-v6-c-empty-state__body">${body}</div>
      </div>
    </div>`;
}

async function loadEvents() {
  const content = document.getElementById('content');
  try {
    const res    = await fetch(API_URL);
    const events = await res.json();

    if (!events.length) {
      content.innerHTML = emptyState(
        'No events scheduled',
        'Nothing in the next 28 days. Check back soon, or subscribe to the ICS feed to get notified automatically.'
      );
      return;
    }

    const today = new Date().toISOString().slice(0, 10);

    const groups = new Map();
    events.forEach(ev => {
      const label = weekLabel(ev.occurrence_date);
      if (!groups.has(label)) groups.set(label, []);
      groups.get(label).push(ev);
    });

    let html = '';
    groups.forEach((evs, label) => {
      html += `<h2 class="pf-v6-c-title pf-m-md samaya-week-header" style="color:var(--pf-t--global--text--color--subtle)">${label}</h2>`;
      evs.forEach(ev => {
        const d        = new Date(ev.occurrence_date + 'T12:00:00Z');
        const isToday  = ev.occurrence_date === today;
        const dayNum   = d.getUTCDate();
        const dowLabel = DOW_FULL[d.getUTCDay()].slice(0, 3);

        html += `
          <div class="pf-v6-c-card pf-v6-u-mb-sm${isToday ? ' pf-m-selected' : ''}">
            <div class="pf-v6-c-card__body">
              <div class="samaya-event-row">
                <div class="samaya-date-col${isToday ? ' samaya-today' : ''}">
                  <div class="samaya-date-day">${dayNum}</div>
                  <div class="samaya-date-dow">${dowLabel}</div>
                </div>
                <div style="flex:1;min-width:0">
                  <div class="pf-v6-l-flex pf-m-align-items-center pf-m-space-items-sm pf-v6-u-mb-xs">
                    <span><strong>${escapeHtml(ev.event_name)}</strong></span>
                    ${tenantBadge(ev)}
                    ${scopeBadge(ev.scope)}
                  </div>
                  <div class="samaya-event-meta pf-v6-u-mb-xs">
                    <span class="pf-v6-u-font-size-sm">🕐 ${formatTime(ev.start_datetime_utc)}</span>
                    <span class="pf-v6-u-font-size-sm">⏱ ${formatDuration(ev.duration_hours)}</span>
                    ${ev.discord_channel ? `<span class="pf-v6-u-font-size-sm">💬 ${escapeHtml(ev.discord_channel)}</span>` : ''}
                    ${statusBadge(ev.post_status)}
                  </div>
                  ${ev.description ? `<p class="pf-v6-u-font-size-sm" style="color:var(--pf-t--global--text--color--subtle)">${escapeHtml(ev.description)}</p>` : ''}
                </div>
              </div>
            </div>
          </div>`;
      });
    });

    content.innerHTML = html;

  } catch (e) {
    content.innerHTML = emptyState('Could not load events', escapeHtml(e.message));
  }
}

loadEvents();
setInterval(loadEvents, 600000);
</script>
</body>
</html>
